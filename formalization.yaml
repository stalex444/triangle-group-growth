sources:
  - title: "Endomorphisms of linear algebraic groups"
    authors:
      - "Robert Steinberg"
    id: "Memoirs of the American Mathematical Society 80 (1968)"
    # Crossref-verified 2026-10-16: DOI 10.1090/memo/0080.
    type: "book"
    location: "https://doi.org/10.1090/memo/0080"
    relationship: "background"
    note: >-
      The rationality of the growth (Poincare) series of a Coxeter
      group and its expression through the finite parabolic subgroups
      — the classical route to the (p, q, inf) formula. Cited for
      attribution; the entry does not formalize Steinberg's formula
      and proves the (p, q, inf) identity directly from normal forms.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Reflection Groups and Coxeter Groups"
    authors:
      - "James E. Humphreys"
    id: "Cambridge Studies in Advanced Mathematics 29, Cambridge University Press, 1990"
    # Crossref-verified 2026-10-16: DOI 10.1017/CBO9780511623646.
    # Section 5.12 ("Poincare series") verified from the table of
    # contents 2026-10-16.
    type: "book"
    location: "https://doi.org/10.1017/CBO9780511623646"
    relationship: "background"
    note: >-
      Standard reference: Section 5.12 for the Poincare series of a
      general Coxeter group. Cited, not formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Growth of planar Coxeter groups, P.V. numbers, and Salem numbers"
    authors:
      - "William J. Floyd"
    id: "Mathematische Annalen 293 (1992), 475-483"
    # Crossref-verified 2026-10-16: DOI 10.1007/BF01444729.
    type: "article"
    location: "https://doi.org/10.1007/BF01444729"
    relationship: "background"
    note: >-
      Growth rates of cofinite non-cocompact (cusped) planar
      hyperbolic Coxeter groups are Pisot numbers; of cocompact ones,
      Salem numbers; and (p. 482) (2,3,inf) has the minimal growth rate
      among the cusped planar groups. For (p, q) != (2, 2) the
      (p, q, inf) groups are cusped planar hyperbolic triangle groups,
      so their growth rates are Pisot by this theorem ((2, 2, inf) is
      affine, growth rate 1); for (2,3,inf) the compared statement (11)
      exhibits the rate as the plastic number, the smallest Pisot
      number (Siegel 1944). Floyd's theorems are cited, not formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Growth functions of surface groups"
    authors:
      - "James W. Cannon"
      - "Philip Wagreich"
    id: "Mathematische Annalen 293 (1992), 239-257"
    # Crossref-verified 2026-10-16: DOI 10.1007/BF01444714.
    type: "article"
    location: "https://doi.org/10.1007/BF01444714"
    relationship: "background"
    note: >-
      Growth functions of planar Coxeter and surface groups; its
      Proposition 3.1 is the source OEIS credits for the generating
      functions of the (2,3,inf), (3,3,inf) and (2,5,inf) sphere
      sequences (A096231, A054886, A265068). Cited per OEIS (the
      proposition was not read for this entry); not formalized.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Cofinite hyperbolic Coxeter groups, minimal growth rate and Pisot numbers"
    authors:
      - "Ruth Kellerhals"
    id: "Algebraic & Geometric Topology 13 (2013), 1001-1025"
    # Crossref-verified 2026-10-16: DOI 10.2140/agt.2013.13.1001.
    type: "article"
    location: "https://doi.org/10.2140/agt.2013.13.1001"
    relationship: "background"
    note: >-
      Computes the growth series of the triangle group [3, inf] =
      (2,3,inf) — the compared instance (3) — and gives (Section 5.2,
      Proposition and Remark) an elementary alternative proof of
      Floyd's result that its growth rate, the plastic number, is the
      minimum over all cofinite non-cocompact planar hyperbolic Coxeter
      groups, with equality only for [3, inf]; in dimension three the
      minimum is the tetrahedral group [3,3,6]. The minimality theorems
      are cited, not formalized; the compared statements (3), (6)-(11)
      are the kernel-checked instance.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Exponential growth rates of free and amalgamated products"
    authors:
      - "Michelle Bucher"
      - "Alexey Talambutsa"
    id: "Israel Journal of Mathematics 212 (2016), 521-546"
    # Crossref-verified 2026-10-16: DOI 10.1007/s11856-016-1299-4;
    # arXiv:1209.4071 (full text read 2026-10-15).
    type: "article"
    location: "https://doi.org/10.1007/s11856-016-1299-4"
    relationship: "background"
    note: >-
      Proposition 18 (Section 6): the growth rate of PGL(2,Z) in the
      three Coxeter reflections is the plastic number — compared
      statement (11), proved there via a normal form (their Lemma 19);
      with Mann's bound (their Theorem 2) this makes it the minimal
      growth rate of PGL(2,Z), and of GL(2,Z), over all finite
