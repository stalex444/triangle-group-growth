status:
  scope: >-
    Formalized, 20 compared theorems, hypotheses inline, all stated for
    an arbitrary Coxeter system cs : CoxeterSystem M W on Fin 3 with
    the matrix entries M 0 1 = 0 (infinity), M 0 2 = p, M 1 2 = q as
    hypotheses. (1) growth_series: for all p, q >= 2, in Z[[X]],
    (PowerSeries.mk (n |-> Nat.card {w // cs.length w = n})) *
    (1 - (sum_{i=1}^{p-1} X^i)(sum_{i=1}^{q-1} X^i)) =
    (1 + X)(sum_{i=0}^{p-1} X^i)(sum_{i=0}^{q-1} X^i).
    (2) triangle_matrix_exists: for all p, q >= 2 a CoxeterMatrix
    (Fin 3) with those entries exists. (3)-(5) growth_series_23/_24/_33:
    the identity at (2,3), (2,4), (3,3) with the products expanded.
    (6) sphere23_values: at (2,3), a(0..4) = 1, 3, 5, 7, 9 and
    a(n+5) = a(n+3) + a(n+2) for all n. (7) sphere23_rec_fails_at_4:
    a(4) differs from a(2) + a(1). (8) sphere23_padovan: for any
    pad : N -> N with pad 0 = pad 1 = pad 2 = 1 and pad (n+3) =
    pad (n+1) + pad n, a(n) = pad (n+5) for n >= 2.
    (9) plastic_exists_unique: exactly one real rho > 1 with
    rho^3 = rho + 1. (10) sphere23_growth_bounds: for 1 < rho with
    rho^3 = rho + 1 and all n >= 2, 2 rho^n <= a(n) <= 4 rho^n.
    (11) sphere23_root_tendsto: a(n)^(1/n) -> rho. (12) sphere_mono and
    (13) sphere_symm compare two systems cs, cs' of types (p,q,inf),
    (p',q',inf) (resp. (q,p,inf)) lengthwise. (14) sphere_ge_plastic:
    (p,q) != (2,2), 1 < rho, rho^3 = rho + 1 give 2 rho^(n+2) <=
    a(n+2). (15) rate_exists_unique. (16)-(20) take any tau > 1
    solving the rate equation: a(n)^(1/n) -> tau; tau < tau' for
    (p,q) <= (p',q') distinct; rho <= tau and (tau = rho iff (p,q) =
    (2,3) or (3,2)); tau < 2; for every sigma < 2 there is N with
    sigma < tau when p, q >= N. NOT formalized (cited): Steinberg's
    general formula; Floyd's Pisot/Salem dichotomy (that tau is Pisot
    is not formalized) and his minimality over all cusped planar
    groups (only its restriction to this family, (14) and (18)); the
    minimality theorems of Bucher-Talambutsa (over generating sets) and
    Terragni (over all Coxeter systems); the isomorphism W(2,3,inf) =
    PGL(2,Z) = W(AE_3); the billiard identification and everything
    physical. No physical claim is part of the compared statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  # Every compared theorem's #print axioms output is exactly
  # [propext, Classical.choice, Quot.sound]; re-elaborated 2026-10-16
  # for all 20 names independently of the proving agents (BUILD.txt).

automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Opus-class, 2026)"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted proof drafting and error-loop iteration against
        lake build (19 compiler builds for statements (1)-(11) and 12
        for the family statements (12)-(20), 2026-10-16); every compared
        declaration kernel-checked and axiom-audited. The (2,3,inf)
        instance was first proved in a scratch development on
        2026-10-15 (Lean 4.31, Mathlib fabf563a; three-state automaton,
