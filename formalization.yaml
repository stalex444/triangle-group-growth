fidelity:
  divergences: >-
    (i) The growth series is stated as a multiplicative identity in
    Z[[X]] rather than as a rational function W(t) = N(t)/D(t); the two
    are equivalent because D has constant term 1 and is invertible in
    Z[[X]], and the identity form avoids any division. (ii) The
    classical route is Steinberg's formula; the entry proves the
    identity directly from amalgam normal forms and does not formalize
    Steinberg's formula or the amalgam structure D_p *_{C_2} D_q as
    such — the normal forms are built by hand and their action is
    lifted to W by the universal property. (iii) The Coxeter matrix is
    not fixed as an object; the statements quantify over any Coxeter
    system whose matrix has the three stated entries, and (2) shows
    such matrices exist. (iv) The Padovan statement (8) is for any
    sequence with the stated initial values and recursion rather than
    for a fixed definition, and holds from n = 2 (a(0) = 1 differs
    from Pad 5 = 3 and a(1) = 3 from Pad 6 = 4, so n >= 2 is the exact
    range). (v) The growth bounds (10) hold from n = 2 (they fail
    at n = 0, where a(0) = 1 < 2). (vi) The limit (11) is the n-th-root
    limit; the ratio limit a(n+1)/a(n) -> rho is not stated.
    (vii) The application to the 3+1 vacuum billiard is cited; the
    identification of the abstract Coxeter system with PGL(2,Z) and
    with the billiard's reflection group is not formalized, and the
    correspondence "n wall collisions = gallery distance n" is
    elementary reflection-group geometry (a geodesic crosses each wall
    at most once), not formal content. (viii) The module TwoThreeInf.lean is a second proof of
    the (2,3,inf) case and is not on the compared surface. (ix)
    tau_{p,q} is not a defined function: (16)-(20) quantify over any
    tau > 1 solving the rate equation, and (15) gives existence and
    uniqueness; for (2,2) no such tau exists. (x) The limit tau -> 2
    (20) is in epsilon-N form jointly in p, q, together with tau < 2
    (19). (xi) The minimality (18) is within the (p,q,inf) family
    only; (14) holds from n = 2. (xii) Prior art for the family
    statements: (12) is the case phi = id of Terragni 2016 Theorem A
    (sphere sizes are monotone whenever m_{st} <= m'_{phi(s)phi(t)}
    for an injection phi), and (13) is the Coxeter isomorphism
    a <-> b; (14) follows from Theorem A and (10); the weak forms of
    (17) and (19) are Terragni's Corollary 3.2 (against (inf,inf,inf),
    growth rate 2), and strict (17) is immediate from Kellerhals 2013
    (5.5)-(5.6) with her Lemma 1(a) (h_k < h_{k+1}); (18) is Floyd
    1992 p. 482 restricted to the family; (20) is a case of Yukita
    2024 Theorem 3.5 (continuity of the growth rate on the space of
    Coxeter systems; Floyd 1992 p. 476 for polygons, as restated
    there). The proofs here are independent (normal-form inclusion,
    the series recursion, the rate equation) and kernel-checked; no
    novelty is claimed.

review:
  status: "self-assessed"
  reviewers:
