      Padovan recursion of statement (6).
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On the growth of a Coxeter group"
    authors:
      - "Tommaso Terragni"
    id: "Groups, Geometry, and Dynamics 10 (2016), 601-618"
    # Crossref-verified 2026-10-16: DOI 10.4171/GGD/358; arXiv:1312.3437.
    type: "article"
    location: "https://doi.org/10.4171/GGD/358"
    relationship: "background"
