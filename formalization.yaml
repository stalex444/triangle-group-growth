alignment:
  namespace: "TriangleGrowth"
  statements:
    - source: "classical (Steinberg 1968 route; the amalgam D_p *_{C_2} D_q); proved here from normal forms"
      lean: "TriangleGrowth.growth_series"
      module: "Solution"
      status: "proved"
      note: >-
        The growth-series identity for every (p, q, inf) Coxeter
        system, p, q >= 2, in Z[[X]].
    - source: "this work (non-vacuity)"
      lean: "TriangleGrowth.triangle_matrix_exists"
      module: "Solution"
      status: "proved"
      note: "A Coxeter matrix of type (p, q, inf) exists for all p, q >= 2."
    - source: "Cannon-Wagreich 1992 Prop. 3.1 (per OEIS A096231); Floyd 1992; Kellerhals 2013 Section 5.2"
      lean: "TriangleGrowth.growth_series_23"
      module: "Solution"
      status: "proved"
      note: "(2,3,inf): W(t)(1 - t^2 - t^3) = (1 + t)^2 (1 + t + t^2)."
    - source: "instance of (1)"
      lean: "TriangleGrowth.growth_series_24"
      module: "Solution"
      status: "proved"
      note: "(2,4,inf): W(t)(1 - t^2 - t^3 - t^4) = (1 + t)^2 (1 + t + t^2 + t^3)."
    - source: "instance of (1)"
      lean: "TriangleGrowth.growth_series_33"
      module: "Solution"
      status: "proved"
      note: "(3,3,inf): W(t)(1 - t^2 - 2 t^3 - t^4) = (1 + t)(1 + t + t^2)^2."
    - source: "this work (coefficient extraction from (3))"
      lean: "TriangleGrowth.sphere23_values"
      module: "Solution"
      status: "proved"
      note: "a(0..4) = 1, 3, 5, 7, 9 and a(n+5) = a(n+3) + a(n+2)."
    - source: "this work"
      lean: "TriangleGrowth.sphere23_rec_fails_at_4"
      module: "Solution"
      status: "proved"
      note: "a(4) = 9 is not a(2) + a(1) = 8: the recursion of (6) fails one step earlier than its stated range."
    - source: "OEIS A096231 ('Equals A000931(n+10)'); kernel certificate here"
      lean: "TriangleGrowth.sphere23_padovan"
      module: "Solution"
      status: "proved"
      note: "a(n) = Pad(n + 5) for n >= 2."
    - source: "classical (the plastic number)"
      lean: "TriangleGrowth.plastic_exists_unique"
      module: "Solution"
      status: "proved"
      note: "Exactly one real rho > 1 with rho^3 = rho + 1."
    - source: "this work (two-sided exponential bounds)"
      lean: "TriangleGrowth.sphere23_growth_bounds"
      module: "Solution"
      status: "proved"
      note: "2 rho^n <= a(n) <= 4 rho^n for n >= 2."
    - source: "Bucher-Talambutsa 2016 Prop. 18 (this statement); Floyd 1992; proved here from (10)"
      lean: "TriangleGrowth.sphere23_root_tendsto"
      module: "Solution"
      status: "proved"
      note: "a(n)^(1/n) -> rho: the growth rate of (2,3,inf) = PGL(2,Z) in its reflections is the plastic number."
    - source: "Terragni 2016 Theorem A (case phi = id); proved here by normal-form inclusion"
      lean: "TriangleGrowth.sphere_mono"
      module: "Solution"
      status: "proved"
      note: "a_{p,q}(n) <= a_{p',q'}(n) for p <= p', q <= q', every n."
    - source: "Coxeter isomorphism a <-> b; proved here by normal-form swap"
      lean: "TriangleGrowth.sphere_symm"
      module: "Solution"
      status: "proved"
      note: "a_{p,q}(n) = a_{q,p}(n) for every n."
    - source: "Terragni 2016 Theorem A with (10); Floyd 1992 p. 482 for the rates"
      lean: "TriangleGrowth.sphere_ge_plastic"
      module: "Solution"
      status: "proved"
      note: "2 rho^n <= a(n) for n >= 2 and every hyperbolic (p, q)."
    - source: "classical (the denominator of (1))"
      lean: "TriangleGrowth.rate_exists_unique"
      module: "Solution"
      status: "proved"
      note: "For (p,q) != (2,2), exactly one tau > 1 solves the rate equation."
    - source: "classical (Floyd 1992); proved here from (1)"
      lean: "TriangleGrowth.sphere_root_tendsto_rate"
      module: "Solution"
      status: "proved"
      note: "a(n)^(1/n) -> tau_{p,q} for every hyperbolic member."
    - source: "Terragni 2016 Cor. 3.2 (weak); strict via Kellerhals 2013 (5.5) and Lemma 1(a); proved here from the rate equation"
      lean: "TriangleGrowth.rate_lt_rate"
      module: "Solution"
      status: "proved"
      note: "tau strictly increasing in (p, q)."
    - source: "Floyd 1992 p. 482; Kellerhals 2013 Section 5.2, restricted to the family"
      lean: "TriangleGrowth.plastic_le_rate"
      module: "Solution"
      status: "proved"
      note: "rho <= tau_{p,q}, with equality exactly at (2,3) and (3,2): the plastic number is the family minimum."
    - source: "elementary; Terragni 2016 Cor. 3.2 gives tau <= 2"
      lean: "TriangleGrowth.rate_lt_two"
      module: "Solution"
      status: "proved"
      note: "tau_{p,q} < 2."
    - source: "Yukita 2024 Theorem 3.5 with omega(inf,inf,inf) = 2 (Floyd 1992 p. 476 for polygons); proved here directly"
      lean: "TriangleGrowth.rate_tendsto_two"
      module: "Solution"
      status: "proved"
      note: "tau_{p,q} -> 2 as p, q -> infinity (epsilon-N form)."

