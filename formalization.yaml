      trees — the OTHER Coxeter invariant that lands on rho
      (Coxeter-element spectral radius, Salem numbers), distinct from
      the word growth of this entry. Independent of this entry; cited
      as context.

  - id: "https://github.com/stalex444/pdt-lean (parent development)"
