    relationship: "builds-on"
    note: >-
      The compared statements use Mathlib's CoxeterMatrix,
      CoxeterSystem and CoxeterSystem.length and nothing custom.
      Mathlib at the pinned revision has no growth or Poincare series
      of Coxeter groups, no Steinberg formula, no exchange or deletion
      property, no parabolic subgroups and no minimal coset
      representatives (checked 2026-10-16): the normal-form
      construction, the lift of its action, the length identity and
      the counting are this entry's contribution. Consumed from
      Mathlib on the compared route: CoxeterSystem.lift /
      lift_apply_simple with CoxeterMatrix.IsLiftable (the universal
      property), simple_induction_left, simple_mul_simple_pow,
      exists_isReduced, length_mul_le, length_simple, length_one, and
      the real-analysis library for the limit.

  - id: "Registered entry PALOMAR-2026-08-31-000004 (stalex444/mahler-measure-minima)"
    relationship: "other"
    note: >-
      Certifies that x^3 - x - 1 attains the minimal Mahler measure
      above one among monic irreducible integer cubics — the arithmetic
      status of the growth rate of (11). Independent of this entry;
      cited as context.

  - id: "Registered entry PALOMAR-2026-09-01-000005 (stalex444/mahler-minimizer-compositum)"
    relationship: "other"
    note: >-
      Certifies that the largest roots of the Bedford-Kim family
      x^(n+1)(x^3 - x - 1) + (x^3 + x^2 - 1) increase to the plastic
